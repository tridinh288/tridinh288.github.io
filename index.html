<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Portfolio — Dinh Quoc Tri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        --bg: #fafaf8;
        --bg2: #ffffff;
        --ink: #16181d;
        --ink2: #434850;
        --muted: #80858e;
        --ghost: rgba(22, 24, 29, 0.05);
        --line: #e5e5e0;
        --chip: #f1f1ec;
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.1);
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.04), 0 16px 36px -18px rgba(0, 0, 0, 0.18);
        --head: "Space Grotesk", "Inter", system-ui, sans-serif;
        --sans:
          "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      :root[data-theme="dark"] {
        --bg: #111315;
        --bg2: #181b1e;
        --ink: #ecedee;
        --ink2: #bfc3c8;
        --muted: #868b93;
        --ghost: rgba(255, 255, 255, 0.045);
        --line: #272a2e;
        --chip: #1d2023;
        --accent: #2dd4bf;
        --accent-soft: rgba(45, 212, 191, 0.12);
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 36px -18px rgba(0, 0, 0, 0.7);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
      }
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.3s,
          color 0.3s;
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      img {
        max-width: 100%;
        display: block;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }
      ::selection {
        background: var(--accent-soft);
      }

      /* ---------- deck ---------- */
      #deck {
        height: 100%;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
      }
      .slide {
        position: relative;
        min-height: 100%;
        scroll-snap-align: start;
        display: flex;
        padding: 28px clamp(20px, 6vw, 88px) 64px;
        overflow: hidden;
      }
      .slide::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
        pointer-events: none;
      }
      .slide.no-line::before {
        display: none;
      }
      .inner {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      .body {
        flex: 1;
        display: flex;
        align-items: center;
        padding: clamp(24px, 5vh, 56px) 0;
      }
      .body > * {
        width: 100%;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(40px, 8vw, 120px);
        align-items: center;
      }
      .split.top {
        align-items: start;
      }

      /* page header */
      .phead {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 44px;
        padding-right: 150px;
        font: 500 12px/1 var(--mono);
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .phead b {
        font-weight: 500;
        color: var(--accent);
      }
      .phead em {
        font-style: normal;
        margin-left: auto;
      }

      /* ---------- chrome ---------- */
      .controls {
        position: fixed;
        top: 39px;
        right: clamp(20px, 6vw, 88px);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .lang {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.06em;
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 9px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .lang:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .theme {
        width: 38px;
        height: 22px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--chip);
        position: relative;
        cursor: pointer;
      }
      .theme::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--ink);
        transition: transform 0.3s;
      }
      :root[data-theme="dark"] .theme::after {
        transform: translateX(16px);
      }
      .counter {
        position: fixed;
        left: clamp(20px, 6vw, 88px);
        bottom: 22px;
        z-index: 50;
        font: 500 12px/1 var(--mono);
        color: var(--ink);
      }
      .counter span {
        color: var(--muted);
      }
      .progress {
        position: fixed;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .progress button {
        width: 4px;
        height: 12px;
        border-radius: 2px;
        border: none;
        background: var(--line);
        cursor: pointer;
        transition:
          background 0.3s,
          height 0.3s;
      }
      .progress button:hover {
        background: var(--muted);
      }
      .progress button.on {
        background: var(--accent);
        height: 22px;
      }

      /* ---------- type ---------- */
      h1,
      h2,
      h3,
      .head {
        font-family: var(--head);
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .title {
        font-size: clamp(40px, 5vw, 68px);
        font-weight: 700;
        margin-bottom: 18px;
      }
      .title .dot {
        color: var(--accent);
      }
      .lead {
        font-size: 16px;
        line-height: 1.75;
        color: var(--ink2);
        max-width: 52ch;
      }
      .muted {
        color: var(--muted);
      }
      .label {
        font: 500 11px/1.4 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        font-size: 12.5px;
        line-height: 1;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--bg2);
        color: var(--ink);
      }
      .bullets {
        list-style: none;
        display: grid;
        gap: 10px;
        color: var(--ink2);
        font-size: 14.5px;
      }
      .bullets li {
        position: relative;
        padding-left: 20px;
      }
      .bullets li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.62em;
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--accent);
      }

      /* buttons */
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 26px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 600 13.5px/1 var(--sans);
        padding: 12px 18px;
        border-radius: 8px;
        text-decoration: none;
        border: 1px solid var(--line);
        background: var(--bg2);
        cursor: pointer;
        transition:
          transform 0.2s,
          border-color 0.2s,
          color 0.2s,
          background 0.2s;
      }
      .btn:hover {
        transform: translateY(-1px);
        border-color: var(--ink);
      }
      .btn.solid {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .btn.solid:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      .accounts {
        flex-basis: 100%;
        margin-top: 4px;
        font: 12.5px/1.8 var(--mono);
        color: var(--ink2);
        background: var(--chip);
        border-radius: 8px;
        padding: 10px 14px;
        max-width: min(380px, 100%);
      }
      .accounts b {
        display: block;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      /* list rows (timeline, skills, stack, features, projects) */
      .rows {
        border-top: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 20px;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .row .label {
        padding-top: 3px;
      }
      .row h4 {
        font: 600 16px/1.35 var(--head);
        letter-spacing: -0.01em;
      }
      .row .org {
        font-size: 13px;
        color: var(--muted);
        margin: 2px 0 6px;
      }
      .row p {
        font-size: 14px;
        line-height: 1.65;
        color: var(--ink2);
      }
      .sec {
        font: 500 12px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 14px;
      }
      .sec.mt {
        margin-top: 34px;
      }

      /* ---------- 01 cover ---------- */
      .cover h1 {
        font-size: clamp(52px, 7.4vw, 112px);
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }
      .cover h1 span {
        display: block;
        color: var(--accent);
      }
      .cover .role {
        margin-top: 26px;
        font: 500 clamp(18px, 1.8vw, 22px)/1.4 var(--head);
        color: var(--ink2);
      }
      .cover dl {
        display: grid;
        grid-template-columns: 120px 1fr;
        border-top: 1px solid var(--line);
      }
      .cover dt,
      .cover dd {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .cover dt {
        font: 500 11px/1.9 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cover dd {
        font-weight: 500;
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        margin-right: 8px;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
      }
      .scroll-hint {
        position: absolute;
        width: auto;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.1em;
        color: var(--muted);
        text-transform: uppercase;
        animation: bob 2s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translate(-50%, 5px);
        }
      }

      /* ---------- 02 about ---------- */
      .about h3 {
        font-size: clamp(22px, 2.2vw, 28px);
        font-weight: 600;
        margin-bottom: 16px;
      }
      .edu {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .edu h4 {
        font: 600 17px/1.35 var(--head);
        letter-spacing: -0.01em;
        margin-top: 8px;
      }
      .edu p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 2px;
      }
      .edu-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 34px;
        margin-top: 16px;
      }
      .edu-stats b {
        display: block;
        font: 700 30px/1 var(--head);
        letter-spacing: -0.03em;
        margin-bottom: 6px;
      }
      .info {
        display: grid;
        grid-template-columns: 110px 1fr;
        border-top: 1px solid var(--line);
      }
      .info dt,
      .info dd {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .info dt {
        font: 500 11px/1.9 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .info a {
        text-decoration: none;
      }
      .info a:hover {
        color: var(--accent);
      }

      /* ---------- 04 skills ---------- */
      .row .chips {
        align-self: center;
      }

      /* ---------- 05 selected ---------- */
      .plist {
        border-top: 1px solid var(--line);
      }
      .pitem {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 16px;
        align-items: start;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px solid var(--line);
        padding: 22px 12px 22px 0;
        cursor: pointer;
        transition:
          padding 0.25s,
          background 0.25s;
      }
      .pitem:hover {
        padding-left: 12px;
        background: var(--bg2);
      }
      .pitem .n {
        font: 500 13px/1.8 var(--mono);
        color: var(--accent);
      }
      .pitem h3 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .pitem p {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .pitem .arr {
        font-size: 20px;
        color: var(--muted);
        transition:
          transform 0.25s,
          color 0.25s;
      }
      .pitem:hover .arr {
        transform: translateX(4px);
        color: var(--accent);
      }
      .count {
        display: flex;
        gap: 40px;
        margin-top: 34px;
      }
      .count b {
        display: block;
        font: 700 44px/1 var(--head);
        letter-spacing: -0.03em;
      }

      /* ---------- projects ---------- */
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin-bottom: 16px;
      }
      .proj .title {
        margin-bottom: 10px;
      }
      .tagline {
        font: 500 18px/1.4 var(--head);
        color: var(--ink2);
        margin-bottom: 18px;
      }
      .proj .lead {
        margin-bottom: 22px;
      }
      .feat .n {
        font: 500 13px/1.5 var(--mono);
        color: var(--accent);
      }
      .row.feat {
        grid-template-columns: 44px 1fr;
      }

      .media {
        position: relative;
        isolation: isolate;
      }
      .halo {
        position: absolute;
        inset: 4% -9% -12%;
        z-index: -1;
        border-radius: 48px;
        filter: blur(56px) saturate(1.6);
        opacity: 0.8;
        pointer-events: none;
      }
      :root[data-theme="dark"] .halo {
        opacity: 0.45;
      }
      .frame {
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .frame .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font: 11px/1 var(--mono);
        color: var(--muted);
      }
      .frame .bar i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line);
      }
      .frame .bar em {
        font-style: normal;
        margin-left: 8px;
      }
      .shot {
        aspect-ratio: 16/10;
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--shot, var(--chip));
        color: rgba(20, 20, 20, 0.55);
        font-size: 13px;
        text-align: center;
      }
      .shot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
      .shot.has-img {
        aspect-ratio: auto;
        display: block;
        background: var(--bg2);
      }
      .shot.has-img img {
        position: static;
        height: auto;
      }
      .shot .ph {
        display: grid;
        gap: 8px;
        place-items: center;
        padding: 20px;
      }
      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-decoration: none;
      }
      .play span {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow);
        transition: transform 0.2s;
      }
      .play:hover span {
        transform: scale(1.08);
      }
      .play span::after {
        content: "";
        border-left: 16px solid #16181d;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        margin-left: 4px;
      }
      .caption {
        margin-top: 12px;
        font: 12px/1.4 var(--mono);
        color: var(--muted);
      }

      /* gallery */
      .gallery {
        position: relative;
        height: 260px; /* chỉnh lại theo ảnh cao nhất trong JS */
        overflow: hidden;
      }
      .gallery .g {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 76%;
        aspect-ratio: var(--ar, 16/10);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        background: var(--shot);
        display: grid;
        place-items: center;
        font: 500 12px/1 var(--mono);
        color: rgba(20, 20, 20, 0.6);
        cursor: pointer;
        transition:
          transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1),
          opacity 0.5s;
      }
      .gallery .g img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--bg2);
      }
      .shot.has-img img,
      .gallery .g.on img {
        cursor: zoom-in;
      }
      .zoom-hint {
        text-align: center;
        margin-top: 8px;
      }
      .lb {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 56px;
        align-items: center;
        gap: 8px;
        padding: 24px 12px;
        background: rgba(10, 11, 13, 0.9);
      }
      .lb[hidden] {
        display: none;
      }
      .lb figure {
        grid-column: 2;
        display: grid;
        gap: 10px;
        justify-items: center;
        min-height: 0;
      }
      .lb img {
        max-width: 100%;
        max-height: calc(100vh - 90px);
        width: auto;
        height: auto;
        border-radius: 8px;
        background: #fff;
      }
      .lb figcaption {
        font: 12px/1.4 var(--mono);
        color: #c9ccd1;
      }
      .lb button {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 22px;
        cursor: pointer;
      }
      .lb button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .lb .lb-x {
        position: absolute;
        top: 14px;
        right: 14px;
      }
      .lb .next {
        grid-column: 3;
      }
      @media (max-width: 900px) {
        .lb {
          grid-template-columns: minmax(0, 1fr);
          padding: 64px 8px 24px;
        }
        .lb figure {
          grid-column: 1;
        }
        .lb .prev,
        .lb .next {
          position: absolute;
          bottom: 16px;
        }
        .lb .prev {
          left: calc(50% - 56px);
        }
        .lb .next {
          left: calc(50% + 12px);
        }
      }
      .gnav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 12px/1 var(--mono);
        color: var(--muted);
        margin-top: 6px;
      }
      .gnav button {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg2);
        cursor: pointer;
        font-size: 15px;
      }
      .gnav button:hover {
        border-color: var(--ink);
      }

      /* ---------- 15 github / cv ---------- */
      .gh-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }
      .gh-head svg {
        width: 40px;
        height: 40px;
        flex: none;
      }
      .gh-head h3 {
        font-size: 24px;
        font-weight: 600;
      }
      .gh-head a {
        font: 12.5px/1.4 var(--mono);
        color: var(--muted);
        text-decoration: none;
      }
      .gh-head a:hover {
        color: var(--accent);
      }
      .repo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
      }
      .repo strong {
        font: 600 15px/1.3 var(--head);
      }
      .repo span {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .repo em {
        font-style: normal;
        color: var(--muted);
        transition:
          transform 0.2s,
          color 0.2s;
      }
      .repo:hover strong,
      .repo:hover em {
        color: var(--accent);
      }

      .split > div:first-child,
      .thanks .body > div {
        position: relative;
      }
      .ghost {
        position: absolute;
        left: -0.04em;
        top: -0.28em;
        z-index: -1;
        font: 700 clamp(110px, 14vw, 210px)/1 var(--head);

        top: 50%;

      /* ============================ RENDER ============================ */
      let lang = "en";
      try {

      const t = (v) =>
        v && typeof v === "object" && !Array.isArray(v)
          ? (v[lang] ?? v.vi ?? v.en)
          : v;
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const pad = (n) => String(n).padStart(2, "0");
      const ext = (h) => `href="${esc(h)}" target="_blank" rel="noopener"`;
      const chips = (items) =>
        `<div class="chips">${items.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
      // big faint word behind the left-column title
      const ghost = (s, pos = "") =>
        `<span class="ghost ${pos}" aria-hidden="true">${esc(s)}</span>`;
      const GH_ICON = `<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.290 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.130-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`;

      const FIRST_PROJECT = 4; // index (0-based) of the first project slide

      function shot(m) {
        const ph = `<div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg>${esc(UI[lang].shotPh)}</div>`;

      const frame = (m) =>

        g.length

        <p class="sec">${L.screens}</p>
        <div class="gallery" data-g>${g.map((x) => `<div class="g" style="--shot:${x.shot}">${x.image ? `<img src="${esc(x.image)}" alt="${esc(t(x.label))}">` : esc(t(x.label))}</div>`).join("")}</div>

        .map(
          (c, i) =>
            `<a class="btn ${c === email ? "solid" : ""}" ${ext(c.href)}>${esc(t(c.v))} ↗</a>`,
        )
        .join("")}</div>
    </div>`,
          "thanks no-line",
        );

        const deck = document.getElementById("deck");
        const keep = deck.scrollTop;
        deck.innerHTML = html;
        deck.scrollTop = keep;
        setup();
      }

      /* ============================ BEHAVIOUR ============================ */
      let slides = [],
        current = 0;
      function setup() {
        const deck = document.getElementById("deck");
        slides = [...deck.querySelectorAll(".slide")];
        const total = slides.length;
        const prog = document.getElementById("progress");
        prog.innerHTML = slides
          .map((_, i) => `<button aria-label="${i + 1}"></button>`)
          .join("");
        [...prog.children].forEach((b, i) => (b.onclick = () => go(i)));
        deck
          .querySelectorAll("[data-go]")
          .forEach((b) => (b.onclick = () => go(+b.dataset.go)));

        const io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              if (e.isIntersecting) e.target.classList.add("seen");
            }),
          { root: deck, threshold: 0.15 },
        );
        slides.forEach((s) => io.observe(s));

        const sync = () => {
          const mid = deck.scrollTop + deck.clientHeight / 2;
          let cur = 0;
          slides.forEach((s, i) => {
            if (s.offsetTop <= mid) cur = i;
          });
          current = cur;
          document.getElementById("counter").innerHTML =
            `${pad(cur + 1)} <span>/ ${pad(total)}</span>`;
          [...prog.children].forEach((b, i) =>
            b.classList.toggle("on", i === cur),
          );
        };
        deck.onscroll = sync;
        sync();

        document.querySelectorAll("[data-g]").forEach((g) => {
          const items = [...g.children],
            nav = g.nextElementSibling,
            n = items.length;
          let k = 0;
          const fit = () => {
            const h = Math.max(...items.map((el) => el.offsetHeight));
            if (h) g.style.height = h + 20 + "px";
          };
          items.forEach((el) => {
            const img = el.querySelector("img");
            if (!img) return;
            const ratio = () => {
              if (img.naturalWidth)
                el.style.setProperty("--ar", img.naturalWidth / img.naturalHeight);
              fit();
            };
            img.complete ? ratio() : img.addEventListener("load", ratio);
          });
          window.addEventListener("resize", fit);
          const draw = () => {
            items.forEach((el, i) => {
              let d = i - k;
              if (d > n / 2) d -= n;
              if (d < -n / 2) d += n;
              const ad = Math.abs(d);
              el.style.transform = `translate(calc(-50% + ${d * 34}%), -50%) scale(${1 - ad * 0.14})`;
              el.style.zIndex = 10 - ad;
              el.style.opacity = ad > 1 ? 0 : 1 - ad * 0.45;
              el.classList.toggle("on", d === 0);
            });
            nav.querySelector("[data-gc]").textContent = `${k + 1} / ${n}`;
          };
          nav.querySelector("[data-prev]").onclick = () => {
            k = (k - 1 + n) % n;
            draw();
          };
          nav.querySelector("[data-next]").onclick = () => {
            k = (k + 1) % n;
            draw();
          };
          items.forEach(
            (el, i) =>
              (el.onclick = () => {
                const imgs = items.map((x) => x.querySelector("img")).filter(Boolean);
                const img = el.querySelector("img");
                if (i === k && img) return openLb(imgs, imgs.indexOf(img));
                k = i;
                draw();
              }),
          );
          draw();
        });

        document
          .querySelectorAll(".shot.has-img img")
          .forEach((img) => (img.onclick = () => openLb([img], 0)));
      }

      /* lightbox: xem ảnh cỡ lớn */
      const lbEl = document.getElementById("lb");
      let lbList = [],
        lbI = 0;
      function drawLb() {
        const img = lbList[lbI];
        document.getElementById("lb-img").src = img.src;
        document.getElementById("lb-img").alt = img.alt;
        const n = lbList.length;
        document.getElementById("lb-cap").textContent =
          (img.alt ? img.alt : "") + (n > 1 ? ` · ${lbI + 1} / ${n}` : "");
        lbEl.querySelectorAll(".prev,.next").forEach((b) => (b.hidden = n < 2));
      }
      function openLb(list, i) {
        lbList = list;
        lbI = Math.max(0, i);
        drawLb();
        lbEl.hidden = false;
        lbEl.querySelector(".lb-x").focus();
      }
      const closeLb = () => (lbEl.hidden = true);
      const stepLb = (s) => {
        lbI = (lbI + s + lbList.length) % lbList.length;
        drawLb();
      };
      lbEl.onclick = (e) => {
        const a = e.target.dataset.lb;
        if (a === "close" || e.target === lbEl || e.target.tagName === "FIGURE") closeLb();
        if (a === "prev") stepLb(-1);
        if (a === "next") stepLb(1);
      };

      function go(i) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        slides[i].scrollIntoView({ behavior: "smooth" });
      }

      document.addEventListener("keydown", (e) => {
        if (!lbEl.hidden) {
          if (e.key === "Escape") closeLb();
          if (e.key === "ArrowLeft") stepLb(-1);
          if (e.key === "ArrowRight") stepLb(1);
          if (e.key !== "Tab") e.preventDefault();
          return;
        }
        if (["ArrowDown", "PageDown", " "].includes(e.key)) {
          e.preventDefault();
          go(current + 1);
        }
        if (["ArrowUp", "PageUp"].includes(e.key)) {
          e.preventDefault();
          go(current - 1);
        }
        if (e.key === "Home") go(0);
        if (e.key === "End") go(slides.length - 1);
      });

      document.getElementById("lang").onclick = () => {
        lang = lang === "vi" ? "en" : "vi";
        try {
          localStorage.setItem("pf-lang", lang);
        } catch (e) {}
        render();
        slides.forEach((s) => s.classList.add("seen"));
      };

      const root = document.documentElement;
      try {
        const th = localStorage.getItem("pf-theme");
        if (th) root.dataset.theme = th;
      } catch (e) {}
      document.getElementById("theme").onclick = () => {
        const dark = root.dataset.theme === "dark";
        root.dataset.theme = dark ? "light" : "dark";
        try {
          localStorage.setItem("pf-theme", root.dataset.theme);
        } catch (e) {}
      };

      render();

      /* Đánh thức server demo: Render gói free ngủ sau ~15 phút không có request,
         nên ping ngầm ngay khi trang mở và cứ 10 phút một lần khi tab đang được xem.
         no-cors: không cần đọc response, chỉ cần request tới được server. */
      const PINGS = DATA.projects.map((p) => p.ping).filter(Boolean);
      const wake = () =>
        PINGS.forEach((u) =>
          fetch(u, { mode: "no-cors", cache: "no-store" }).catch(() => {}),
        );
      wake();
      // Chỉ nhắc lại khi người xem còn thao tác (cuộn, bấm, gõ phím) trong 10 phút qua,
      // và tối đa 3 lần (~30 phút): tab bị treo/bỏ quên thì không giữ server thức.
      let lastActive = Date.now(),
        rewakes = 0;
      ["pointerdown", "keydown", "wheel", "touchstart"].forEach((ev) =>
        addEventListener(ev, () => (lastActive = Date.now()), { passive: true }),
      );
      const timer = setInterval(() => {
        const idle = Date.now() - lastActive > 10 * 60 * 1000;
        if (document.visibilityState !== "visible" || idle) return;
        wake();
        if (++rewakes >= 3) clearInterval(timer);
      }, 10 * 60 * 1000);
    </script>
  </body>
</html>
